<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202030">
  <meta name="description" content="Portfólio de ilustração de Paulo Felipe.">
  <title>Paulo Felipe — Ilustração</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#portfolio">Ir para o portfólio</a>

  <header class="site-header" aria-label="Cabeçalho do portfólio">
    <a class="brand" href="#obra-01" aria-label="Voltar ao início">Paulo Felipe</a>
    <p class="counter" aria-live="polite"><span id="current-slide">01</span><span aria-hidden="true">/</span>10</p>
  </header>

  <main id="portfolio" class="portfolio">
    <section class="artwork artwork--intro" id="obra-01" data-index="01" aria-label="Obra 1 de 10">
      <img
        src="01.png"
        alt="Ilustração de Paulo Felipe, obra 01"
        class="artwork__image"
        loading="eager"
        fetchpriority="high"
        decoding="async"
      >
      <div class="artwork__shade" aria-hidden="true"></div>

      <article class="bio-card" aria-labelledby="bio-title">
        <p class="eyebrow">Portfólio de ilustração</p>
        <h1 id="bio-title">Paulo Felipe</h1>
        <p class="bio-card__text">
          Formação em Ciência de Dados e Design Gráfico pela Alura e em UI Design pelo California Institute of the Arts, via Coursera.
        </p>
        <a class="bio-card__link" href="https://t.me/opaulofelipe" target="_blank" rel="noopener noreferrer">
          Falar no Telegram
          <span aria-hidden="true">↗</span>
        </a>
      </article>

      <a class="scroll-cue" href="#obra-02" aria-label="Ver próxima ilustração">
        <span>Rolar</span>
        <span class="scroll-cue__line" aria-hidden="true"></span>
      </a>
    </section>

    <section class="artwork" id="obra-02" data-index="02" aria-label="Obra 2 de 10">
      <img src="02.png" alt="Ilustração de Paulo Felipe, obra 02" class="artwork__image" loading="lazy" decoding="async">
    </section>

    <section class="artwork" id="obra-03" data-index="03" aria-label="Obra 3 de 10">
      <img src="03.png" alt="Ilustração de Paulo Felipe, obra 03" class="artwork__image" loading="lazy" decoding="async">
    </section>

    <section class="artwork" id="obra-04" data-index="04" aria-label="Obra 4 de 10">
      <img src="04.png" alt="Ilustração de Paulo Felipe, obra 04" class="artwork__image" loading="lazy" decoding="async">
    </section>

    <section class="artwork" id="obra-05" data-index="05" aria-label="Obra 5 de 10">
      <img src="05.png" alt="Ilustração de Paulo Felipe, obra 05" class="artwork__image" loading="lazy" decoding="async">
    </section>

    <section class="artwork" id="obra-06" data-index="06" aria-label="Obra 6 de 10">
      <img src="06.png" alt="Ilustração de Paulo Felipe, obra 06" class="artwork__image" loading="lazy" decoding="async">
    </section>

    <section class="artwork" id="obra-07" data-index="07" aria-label="Obra 7 de 10">
      <img src="07.png" alt="Ilustração de Paulo Felipe, obra 07" class="artwork__image" loading="lazy" decoding="async">
    </section>

    <section class="artwork" id="obra-08" data-index="08" aria-label="Obra 8 de 10">
      <img src="08.png" alt="Ilustração de Paulo Felipe, obra 08" class="artwork__image" loading="lazy" decoding="async">
    </section>

    <section class="artwork" id="obra-09" data-index="09" aria-label="Obra 9 de 10">
      <img src="09.png" alt="Ilustração de Paulo Felipe, obra 09" class="artwork__image" loading="lazy" decoding="async">
    </section>

    <section class="artwork" id="obra-10" data-index="10" aria-label="Obra 10 de 10">
      <img src="10.png" alt="Ilustração de Paulo Felipe, obra 10" class="artwork__image" loading="lazy" decoding="async">
    </section>
  </main>

  <a
    class="telegram-fab"
    href="https://t.me/opaulofelipe"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Abrir conversa com @opaulofelipe no Telegram"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.665 3.717 2.934 10.556c-1.21.486-1.203 1.16-.222 1.461l4.552 1.421 10.532-6.646c.498-.303.953-.14.579.192l-8.533 7.701-.314 4.496c.46 0 .663-.21.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.786l3.019-14.227c.31-1.241-.473-1.803-1.281-1.238Z"/>
    </svg>
    <span>Telegram</span>
  </a>

  <noscript>
    <p class="noscript-message">Este portfólio funciona sem JavaScript; apenas o contador de obras não será atualizado durante a rolagem.</p>
  </noscript>
</body>
</html>
